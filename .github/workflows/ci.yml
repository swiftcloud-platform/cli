name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify go.mod is tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum
      # This action's major version and .golangci.yml's `version:` move
      # together: v6 of the action could only install golangci-lint v1, whose
      # last release (1.64.8) is built with Go 1.24 and refuses this module's
      # `go 1.25.0` outright. v7 and later install v2, which the config is
      # written for.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
      - run: go test -race -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

  # Every release target must compile on every push, not just on tag day.
  cross-build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -o /dev/null .

  # Windows is a first-class target, so something must actually run there.
  # Cross-compiling proves it links; only a real run catches a path separator
  # baked into an object key or a config directory that does not exist.
  windows:
    name: Test on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - name: cloud version runs
        run: go run . version
      - name: install.ps1 parses
        shell: pwsh
        run: |
          $errs = $null; $toks = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./install.ps1), [ref]$toks, [ref]$errs) | Out-Null
          if ($errs.Count -gt 0) {
            $errs | ForEach-Object { Write-Host "::error::$($_.Message) (line $($_.Extent.StartLineNumber))" }
            exit 1
          }
          Write-Host "install.ps1 parses cleanly"

  goreleaser-check:
    name: goreleaser config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check
