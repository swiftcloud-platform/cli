# goreleaser v2 — one config produces every platform build and the release.
# Run by .github/workflows/release.yml on a v* tag. Locally: `goreleaser release --snapshot --clean`.
version: 2

project_name: cloud

# No before-hooks. The tests run in their own job in release.yml, without the
# release job's write token or signing identity, and that job must pass first.
# `go mod tidy` is not run here either: a release builds exactly the go.mod
# and go.sum that were tagged, and CI already fails when they are not tidy.

builds:
  - id: cloud
    main: .
    binary: cloud
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .ShortCommit }}
      - -X main.date={{ .CommitDate }}

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: checksums.txt
  algorithm: sha256

# One SPDX SBOM per archive (cloud_<ver>_<os>_<arch>.tar.gz.sbom.json), made by
# syft, which release.yml installs, and attached to the release beside the
# archives.
sboms:
  - artifacts: archive

# Keyless signing of checksums.txt with cosign, using the release workflow's
# GitHub OIDC identity — no key to keep or leak. checksums.txt lists every
# archive, so its one signature covers them all. The output is a
# Sigstore bundle (certificate, signature and transparency-log proof in one
# file): checksums.txt.sigstore.json. Verify with:
#
#   cosign verify-blob checksums.txt \
#     --bundle checksums.txt.sigstore.json \
#     --certificate-identity-regexp '^https://github\.com/swiftcloud-platform/cli/\.github/workflows/release\.yml@refs/tags/v' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
#
# then check the archive against checksums.txt as usual.
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - --yes

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]

release:
  github:
    owner: swiftcloud-platform
    name: cli
  draft: false
  prerelease: auto

# Homebrew: deliberately absent for now. goreleaser's `brews` publisher fails the
# whole release when the tap repository or its token is missing, and
# swiftcloud-platform/homebrew-tap does not exist yet. Re-add once it does:
#
#   brews:
#     - name: cloud
#       repository: { owner: swiftcloud-platform, name: homebrew-tap, token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}" }
#       homepage: https://cloud.co.zm
#       description: SwiftCloud from the command line
#       install: bin.install "cloud"
#
# and set HOMEBREW_TAP_GITHUB_TOKEN in .github/workflows/release.yml.
